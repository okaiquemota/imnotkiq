<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>imnotkiq · Fotos dos eventos</title>
    <meta name="description" content="imnotkiq: fotografia automotiva por Kaique Mota. As fotos dos eventos, no Drive.">
    <meta name="theme-color" content="#0a0a0a">
    <meta property="og:type" content="website">
    <meta property="og:title" content="imnotkiq · Fotos dos eventos">
    <meta property="og:description" content="As fotos dos eventos, no Drive.">
    <meta property="og:image" content="https://okaiquemota.github.io/imnotkiq/fotos/ultimate-drift-01.jpg">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial,sans-serif' font-size='20' font-weight='700' fill='%23ededed' text-anchor='middle'%3Ek%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
    <header class="topo">
        <a class="marca" href="./">imnotkiq</a>
        <a href="https://www.instagram.com/imnotkiq/" target="_blank" rel="noopener">Instagram ↗</a>
    </header>

    <main>
        <!-- O evento mais novo da lista (assets/js/eventos.js) -->
        <section class="destaque" id="destaque" aria-label="Último evento"></section>

        <!-- Os outros eventos; só aparece quando tiver mais de um -->
        <section class="eventos" id="eventos" aria-labelledby="eventos-titulo" hidden>
            <h2 class="secao" id="eventos-titulo">Eventos anteriores</h2>
            <ol class="lista" id="lista"></ol>
        </section>

        <!-- As fotos do evento mais novo; clicar abre grande -->
        <section class="galeria" id="galeria" aria-labelledby="galeria-titulo">
            <div class="galeria-topo">
                <h2 class="secao" id="galeria-titulo"></h2>
                <a class="galeria-drive" id="galeria-drive" target="_blank" rel="noopener" hidden>Todas as fotos no Drive ↗</a>
            </div>
            <ul class="grade" id="grade"></ul>
        </section>
    </main>

    <footer class="base">
        <p class="assinatura" aria-hidden="true"><span id="assinatura">imnotkiq</span></p>
        <div class="base-linha">
            <span>© <span data-ano>2026</span> Kaique Mota</span>
            <a href="https://www.instagram.com/imnotkiq/" target="_blank" rel="noopener">@imnotkiq</a>
            <a href="https://www.instagram.com/kiq.ham/" target="_blank" rel="noopener">@kiq.ham</a>
        </div>
    </footer>

    <!-- Foto grande -->
    <dialog class="visor" id="visor" aria-label="Foto">
        <img class="visor-foto" id="visor-foto" alt="">
        <button class="visor-btn visor-fechar" id="visor-fechar" type="button">Fechar</button>
        <button class="visor-btn visor-ant" id="visor-ant" type="button" aria-label="Foto anterior">←</button>
        <button class="visor-btn visor-prox" id="visor-prox" type="button" aria-label="Próxima foto">→</button>
        <span class="visor-conta" id="visor-conta"></span>
    </dialog>

    <script src="assets/js/eventos.js"></script>
    <script src="assets/js/site.js"></script>
</body>
</html>
